<html>

<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+Kannada&family=Rubik+Iso&family=Yatra+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" type="text/css"
        href="styles.css" media="screen" />
    <title>SecureBrowser</title>
    <style>
        .custom-tab {
            background:#252934;
            padding:8px 15px;
            margin-right:5px;
            border-radius:8px 8px 0 0;
            cursor:pointer;
            display:flex;
            align-items:center;
            border:1px solid #1edbcb;
            border-bottom:none;
        }
        .custom-tab.active {
            background:#1edbcb;
            color:#252934;
        }
    </style>
</head>

<body>
    <div class="container" id="mainContainer">
        <!-- Re-integrate Browser Toolbars & Tabs -->
        <div class="browser-header" style="width:100%; display:flex; justify-content:space-between; align-items:center; background:#2E3441; padding: 10px;">
            <div id="tabContainer" style="display:flex; flex-grow:1; overflow-x:auto; margin-top: 5px;">
                <div class="new-tab-btn" onclick="createNewTab()" style="font-size:20px; cursor:pointer; margin-left:10px; color:white;">+</div>
            </div>
            <div class="browser-controls" style="display:flex; gap:10px; margin-right:20px;">
                <button onclick="navBack()" style="background:none; border:none; color:white; cursor:pointer; font-size:18px;">◄</button>
                <button onclick="navForward()" style="background:none; border:none; color:white; cursor:pointer; font-size:18px;">►</button>
                <button onclick="navReload()" style="background:none; border:none; color:white; cursor:pointer; font-size:18px;">↻</button>
                <button onclick="openSettings()" style="background:none; border:none; color:white; cursor:pointer; font-size:18px;">⚙ Settings</button>
            </div>
        </div>

        <div id="time" class="time"></div>

        <form id="searchForm" method="GET" action="http://www.google.com/search">
            <input name="as_q" class="search-field" placeholder="Search Google or type a URL" autofocus>
            <button type="submit" class="search-submit" value="" style="fill: white"></button>
        </form>

        <div class="box">
            <div class="box-container">
                <div class="heading">Entertainment</div>
                <div class="icons">
                    <a href="https://www.youtube.com/?gl=DE" target="_blank">
                        <div class="link" tabindex="1"> <img src="youtube_1384060.png" alt="" class="youtube">Youtube
                        </div>
                    </a>
                    <a href="https://www.spotify.com/de/" target="_blank">
                        <div class="link" tabindex="3"><img src="spotify_174872.png" alt="" class="spotify">Spotify
                        </div>
                    </a>
                    <a href="https://www.netflix.com/de/" target="_blank">
                        <div class="link" tabindex="2"><img src="netflix_732228.png" alt="" class="netflix">Netflix
                        </div>
                    </a>

                    <a href="https://www.amazon.de/amazonprime?_encoding=UTF8&%2AVersion%2A=1&%2Aentries%2A=0"
                        target="_blank">
                        <div class="link" tabindex="4"><img src="instagram_2111463.png" alt="" class="insta">Instagram</div>
                    </a>
                </div>
            </div>
            <div class="box-container">
                <div class="heading">Study</div>
                <a href="https://www.coursera.org/" target="_blank">
                    <div class="link" tabindex="5"><img src="training_2849198.png" alt="" class="coursera">Coursera</div>
                </a>
                <a href="https://www.udemy.com/" target="_blank">
                    <div class="link" tabindex="6"><img src="online-learning_2436874.png" alt="" class="udemy">Udemy</div>
                </a>
                <a href="https://www.youtube.com/?gl=DE" target="_blank">
                    <div class="link" tabindex="7"><img src="youtube_1384060.png" alt="" class="youtube">Youtube</div>
                </a>
                <a href="https://github.com/" target="_blank">
                    <div class="link" tabindex="8"><img src="github_733609.png" alt="" class="github">Github</div>
                </a>
            </div>
            <div class="box-container">
                <div class="heading">Creative</div>
                <a href="https://www.canva.com/" target="_blank">
                    <div class="link" tabindex="9"><img src="draw_3907787.png" alt="" class="canva">Canva</div>
                </a>
                <a href="https://unsplash.com/" target="_blank">
                    <div class="link" tabindex="10"><img src="picture_2659360.png" alt="" class="unsplash">Unsplash</div>
                </a>
                <a href="https://artsandculture.google.com/" target="_blank">
                    <div class="link" tabindex="11"><img src="paint-palette_2970785.png" alt="" class="GArt">Google Art</div>
                </a>
                <a href="https://www.dafont.com/de/" target="_blank">
                    <div class="link" tabindex="12"><img src="font_420957.png" alt="" class="dafont">dafont</div>
                </a>
            </div>
            <div class="box-container">
                <div class="heading">Research</div>
                <a href="https://chat.openai.com/" target="_blank">
                    <div class="link" tabindex="13"><img src="artificial-intelligence_8334406.png" alt="" class="chatgpt">ChatGPT</div>
                </a>
                <a href="https://leetcode.com/" target="_blank">
                    <div class="link" tabindex="14"><img src="password_5737934.png" alt="" class="leetcode">Leetcode</div>
                </a>
                <a href="https://www.reddit.com/" target="_blank">
                    <div class="link" tabindex="15"><img src="reddit_3536761.png" alt="" class="reddit">Reddit</div>
                </a>
                <a href="https://twitter.com/" target="_blank">
                    <div class="link" tabindex="16"><img src="twitter_3670151.png" alt="" class="twitter">Twitter</div>
                </a>
            </div>
        </div>
    </div>


        <!-- Settings Overlay -->
        <div id="settingsOverlay" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:9999;">
            <div style="background:#2E3441; padding:30px; border-radius:10px; width:400px; text-align:left; border:1px solid #1edbcb;">
                <h2 style="margin-bottom:20px;">Settings / Настройки</h2>
                <div style="margin-bottom:15px;">
                    <label>Language:</label>
                    <select id="langSelect" style="float:right; padding:5px; background:#252934; color:white; border:1px solid #6C7789;">
                        <option value="en">English</option>
                        <option value="ru">Русский</option>
                    </select>
                </div>
                <div style="margin-bottom:15px;">
                    <label>Hardware Acceleration:</label>
                    <input type="checkbox" id="hwAccelCheck" checked style="float:right;">
                </div>
                <div style="margin-bottom:15px;">
                    <label>Restore Tabs on Startup:</label>
                    <input type="checkbox" id="restoreTabsCheck" checked style="float:right;">
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:30px;">
                    <button onclick="saveSettings()" style="padding:10px 20px; background:#1edbcb; border:none; border-radius:5px; cursor:pointer;">Save</button>
                    <button onclick="closeSettings()" style="padding:10px 20px; background:#dc0808; border:none; border-radius:5px; color:white; cursor:pointer;">Close</button>
                </div>
            </div>
        </div>
    </div>


    <script src="index.js"></script>
    <script>
        // Restored Tab and Navigation Logic
        let currentActiveTabId = -1;

        window.onload = function() {
            setTimeout(() => {
                if(window.cefQuery) {
                    createNewTab();
                } else {
                    console.error('Warning: cefQuery not found. Not in Sandbox?');
                }
            }, 500);
        };

        function createNewTab() {
            if (!window.cefQuery) return;
            window.cefQuery({
                request: 'Tab_New',
                onSuccess: function(tabIdStr) {
                    const newTabId = parseInt(tabIdStr);
                    addTabUI(newTabId);
                },
                onFailure: function(code, msg) {}
            });
        }

        function switchTab(tabId) {
            if (!window.cefQuery) return;
            window.cefQuery({
                request: 'Tab_Switch_' + tabId,
                onSuccess: function() { updateActiveTabUI(tabId); },
                onFailure: function(code, msg) {}
            });
        }

        function closeTab(event, tabId) {
            event.stopPropagation();
            if (!window.cefQuery) return;
            window.cefQuery({
                request: 'Tab_Close_' + tabId,
                onSuccess: function() { removeTabUI(tabId); },
                onFailure: function(code, msg) {}
            });
        }

        function addTabUI(tabId) {
            const container = document.getElementById('tabContainer');
            const newBtn = document.querySelector('.new-tab-btn');
            const tabDiv = document.createElement('div');
            tabDiv.className = 'custom-tab';
            tabDiv.setAttribute('data-tab-id', tabId);
            tabDiv.onclick = () => switchTab(tabId);

            tabDiv.innerHTML = `
                <span style="font-size:14px; margin-right:10px;">New Tab</span>
                <span class="close-btn" style="color:#dc0808; font-weight:bold; padding: 0 5px;" onclick="closeTab(event, ${tabId})">×</span>
            `;
            container.insertBefore(tabDiv, newBtn);
            updateActiveTabUI(tabId);
        }

        function updateActiveTabUI(activeId) {
            currentActiveTabId = activeId;
            document.querySelectorAll('.custom-tab').forEach(tab => {
                if (parseInt(tab.getAttribute('data-tab-id')) === activeId) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
        }

        function removeTabUI(tabId) {
            const tab = document.querySelector(`.custom-tab[data-tab-id="${tabId}"]`);
            if (tab) tab.remove();
        }

        function navBack() { if(window.cefQuery) window.cefQuery({ request: 'Nav_Back', onSuccess:()=>{}, onFailure:()=>{} }); }
        function navForward() { if(window.cefQuery) window.cefQuery({ request: 'Nav_Forward', onSuccess:()=>{}, onFailure:()=>{} }); }
        function navReload() { if(window.cefQuery) window.cefQuery({ request: 'Nav_Reload', onSuccess:()=>{}, onFailure:()=>{} }); }

        // Settings Modal Handlers
        function openSettings() {
            document.getElementById('settingsOverlay').style.display = 'flex';
        }
        function closeSettings() {
            document.getElementById('settingsOverlay').style.display = 'none';
        }
        function saveSettings() {
            const lang = document.getElementById('langSelect').value;
            const hw = document.getElementById('hwAccelCheck').checked;
            const rt = document.getElementById('restoreTabsCheck').checked;

            if(window.cefQuery) {
                window.cefQuery({
                    request: `Settings_Save_${lang}_${hw}_${rt}`,
                    onSuccess: function() { closeSettings(); },
                    onFailure: function() {}
                });
            }
        }

        // SecureBrowser Native IPC Bindings overlay
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.querySelector('.search-field').value.trim();
            if(!input || !window.cefQuery) return;

            // Send URL/Search query to native C++
            window.cefQuery({
                request: 'Nav_Load_URL_' + input,
                onSuccess: function() { console.log('Navigation success'); },
                onFailure: function(c, msg) { console.error('Navigation failed: ' + msg); }
            });
        });

        // Add basic settings trigger to time click
        document.getElementById('time').addEventListener('click', function() {
            if(window.cefQuery) {
                window.cefQuery({
                    request: 'Settings_Open',
                    onSuccess: function() {},
                    onFailure: function() {}
                });
            }
        });
    </script>
</body>

</html>
